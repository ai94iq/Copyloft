name: CI

on:
  push:
  pull_request:

# Tests read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: .\test.bat --no-pause

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Xvfb gives the X11 tests a real server (XFixes, XTEST); libsecret-1-0 lets the keyring
      # binding load (no Secret Service runs, so it reports no keyring).
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libsecret-1-0

      # Job logs need a signed-in reader; an annotation is public, so failures are echoed as one.
      - name: Test
        run: |
          xvfb-run -a ./test.sh > test.log 2>&1 && exit 0
          tail -5 test.log
          # The failed tests, or the end of the log when the run died before reporting any.
          sed -i 's/\x1b\[[0-9;]*m//g' test.log     # color codes would hide line starts from grep
          { grep -E -A8 '^failed' test.log || tail -40 test.log; } | head -80 > failures.txt
          details=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' failures.txt)
          echo "::error title=Test failures::$details"
          exit 1

  # No Mac to test on locally: this job is where the macOS interop runs (Keychain, pasteboard,
  # Carbon hotkey, frontmost app).
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: |
          ./test.sh > test.log 2>&1 && exit 0
          tail -5 test.log
          sed -i '' $'s/\x1b\\[[0-9;]*m//g' test.log
          { grep -E -A8 '^failed' test.log || tail -40 test.log; } | head -80 > failures.txt
          details=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g' failures.txt)
          echo "::error title=Test failures::$details"
          exit 1

      # The spec's macOS acceptance: the bundle is produced and structurally valid (plist, ad-hoc
      # signature, executable), for Apple Silicon and Intel.
      - name: Package
        run: ./package-macos.sh
