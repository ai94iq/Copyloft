name: Release

on:
  push:
    tags: ['v*']

# Each job asks for what it needs; only the jobs that publish to the release may write.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Directory.Build.props Version $version"
          }

      - name: Package
        run: .\package.bat --no-pause

      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = (Get-ChildItem artifacts\installer\*.msi -Recurse).FullName
          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release upload "$env:GITHUB_REF_NAME" $msi --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" $msi --title "$env:GITHUB_REF_NAME" --generate-notes
          }

      - name: Refresh the winget manifests
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $msi = (Get-ChildItem artifacts\installer\*.msi -Recurse | Select-Object -First 1).FullName
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductCode'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $code = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)

          foreach ($file in Get-ChildItem packaging\winget -Filter '*.yaml') {
            $text = Get-Content -Raw $file.FullName
            $text = $text -replace '(?m)^PackageVersion: .*$', "PackageVersion: $version"
            $text = $text -replace 'https://github\.com/ai94iq/Copyloft/releases/download/v[\d.]+/Copyloft-Setup-[\d.]+\.msi', "https://github.com/ai94iq/Copyloft/releases/download/v$version/Copyloft-Setup-$version.msi"
            $text = $text -replace '(?m)^    InstallerSha256: .*$', "    InstallerSha256: $hash"
            $text = $text -replace '(?m)^ProductCode: .*$', "ProductCode: `"$code`""
            $text = $text -replace 'https://github\.com/ai94iq/Copyloft/releases/tag/v[\d.]+', "https://github.com/ai94iq/Copyloft/releases/tag/v$version"
            Set-Content $file.FullName $text -NoNewline
          }

      # Needs a repository secret WINGET_TOKEN (a GitHub token with public_repo). Without it the
      # submission is skipped, and the manifests above stay refreshed for a manual submission.
      # Secrets cannot be read in a step `if`, and a job-level variable would hand the token to
      # the build and packaging steps too, so only these two steps see it.
      - name: Check for the winget token
        id: winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          "present=$(-not [string]::IsNullOrEmpty($env:WINGET_TOKEN))" >> $env:GITHUB_OUTPUT

      - name: Submit to winget
        if: ${{ steps.winget.outputs.present == 'True' }}
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          winget install --id Microsoft.WingetCreate -e --accept-source-agreements --accept-package-agreements
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          wingetcreate submit --prtitle "New version: ai94iq.Copyloft version $version" --token $env:WINGET_TOKEN packaging\winget

  # The Windows job creates the release; this one adds the Linux packages to it.
  release-linux:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Package
        run: ./package.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/linux/*.tar.gz artifacts/linux/*.deb artifacts/linux/*.rpm --clobber

  # The macOS app, unsigned by Apple (ad-hoc only), added to the same release.
  release-macos:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Package
        run: ./package-macos.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/macos/*.dmg --clobber
